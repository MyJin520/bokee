# 系统配置
system:
  db-type: mysql       # mysql / postgres
  oss-type: local      # 存储类型
  addr: localhost:9999          # 服务端口
  default-admin-password: "123456"    # 初始管理员密码（留空则自动生成随机密码，控制台打印）

# 数据库通用配置
db:
  user-name: root
  password: 123456
  db-name: kim
  config: charset=utf8mb4&parseTime=True&loc=Local  # MySQL参数/PG参数
  path: localhost:3306  # 地址:端口
  log-mode: error
  max-idle-conn: 10        # 最大空闲连接
  max-open-conn: 100       # 最大连接数
  conn-max-life-time: 1    # 连接最大生命周期（单位：小时）

# 日志配置
log:
  level: info        # debug/info/warn/error
  format: console    # json/console
  output: both       # stdout/file/both
  file-path: ./logs
  max-size: 100      # 单个日志文件最大大小(MB)
  max-backups: 10     # 保留的旧日志文件最大数量
  max-age: 30        # 保留旧日志文件的最大天数
  compress: true     # 是否压缩

# Redis 配置
redis:
  addr: localhost:6379           # 地址（host:port）
  password: "123456"                   # 密码（无密码留空）
  db: 0                          # 数据库编号（0-15）
  pool-size: 10                  # 连接池大小
  min-idle-conns: 5              # 最小空闲连接数
  dial-timeout: 5                # 连接超时（秒）
  read-timeout: 3                # 读取超时（秒）
  write-timeout: 3               # 写入超时（秒）

# JWT 配置
jwt:
  secret: "ac6185d7-b8d0-4646-9dde-d14be1bd55c6"   # 签名密钥
  expire: 2h                     # Access Token 有效期
  refresh-expire: 168h           # Refresh Token 有效期
  issuer: "kim-system"           # 签发者
  audience:                      # 受众列表
    - "client"


